name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: vatsingranite-prod
  AZURE_RG: modernex-rg
  NODE_VERSION: '22.x'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install all dependencies (devDeps needed for build)
        run: npm ci

      - name: Build frontend
        run: npm run build:web

      - name: Package for deployment (source + pre-built dist, no node_modules)
        run: |
          zip -r deploy.zip . \
            --exclude "node_modules/*" \
            --exclude "packages/web/src/*" \
            --exclude "packages/web/node_modules/*" \
            --exclude "packages/shared/node_modules/*" \
            --exclude "packages/api/node_modules/*" \
            --exclude ".git/*" \
            --exclude "*.DS_Store" \
            --exclude "data/*.db*" \
            --exclude "docs/*" \
            --exclude "deploy.zip" \
            --exclude ".github/*"

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy.zip

      - name: Health check
        run: |
          sleep 45
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 15s…"
            sleep 15
          done
          echo "✗ Health check failed"
          exit 1
